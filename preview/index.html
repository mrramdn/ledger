<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="border-b border-border bg-card">
      <div class="mx-auto flex h-10 max-w-[1600px] items-center justify-between px-4">
        <div class="flex items-baseline gap-2">
          <h1 class="font-mono text-sm font-semibold tracking-tight">Ledger</h1>
          <span class="type-caption text-muted-foreground">Beta</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="meta" class="hidden type-mono text-xs text-muted-foreground sm:inline"></span>
          <button
            id="theme"
            type="button"
            aria-label="Switch between light and dark"
            class="inline-flex size-8 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
          ></button>
        </div>
      </div>
    </header>

    <!-- The cards in groups by category. Each group is a masonry: 1px rows, and each card spans as many as it is tall,
         so cards keep their natural height. -->
    <main id="gallery" class="mx-auto max-w-[1600px] px-4 pt-4"></main>

    <script>
      const icon = (paths, size = 16) =>
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
      const icons = {
        copy: icon('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),
        reset: icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
        check: icon('<path d="M20 6 9 17l-5-5"/>'),
        theme: icon('<path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>'),
        search: icon('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
        chevronDown: icon('<path d="m6 9 6 6 6-6"/>', 14),
        chevronLeft: icon('<path d="m15 18-6-6 6-6"/>'),
        chevronRight: icon('<path d="m9 18 6-6-6-6"/>'),
        more: icon('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'),
        download: icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>'),
        refresh: icon('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>'),
        filter: icon('<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>'),
        plus: icon('<path d="M5 12h14"/><path d="M12 5v14"/>'),
        help: icon('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'),
        pin: icon('<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>'),
      };
      // Deltas carry a sign as well as a color: a small triangle, up or down.
      const up = '<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 1 7.5 7h-7z" fill="currentColor"/></svg>';
      const down = '<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 7 .5 1h7z" fill="currentColor"/></svg>';

      // A sparkline path from values, drawn in a 240×48 box with 2px of headroom.
      const spark = (values) => {
        const min = Math.min(...values), max = Math.max(...values);
        const pts = values.map((v, i) => [(i / (values.length - 1)) * 240, 46 - ((v - min) / (max - min || 1)) * 44]);
        const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
        return { line, area: `${line} L240 48 L0 48 Z` };
      };
      const trend = spark([980, 1012, 994, 1048, 1031, 1092, 1124, 1088, 1141, 1162, 1138, 1195, 1221, 1189, 1234]);

      const button =
        'inline-flex h-8 shrink-0 items-center justify-center gap-1.5 rounded-sm px-3 type-ui whitespace-nowrap transition-colors disabled:pointer-events-none disabled:opacity-40';
      const primary = `${button} bg-primary text-primary-foreground hover:bg-primary-hover`;
      const secondary = `${button} border border-input bg-card text-foreground hover:bg-accent`;
      const ghost = `${button} text-muted-foreground hover:bg-accent hover:text-foreground`;
      const destructive = `${button} bg-destructive text-destructive-foreground hover:bg-destructive/90`;
      const busy = '<span class="size-3.5 animate-spin rounded-full border-2 border-white/30 border-t-white" aria-hidden="true"></span>';
      const iconButton =
        'inline-flex size-8 shrink-0 items-center justify-center rounded-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground aria-pressed:bg-accent aria-pressed:text-foreground disabled:pointer-events-none disabled:opacity-40';
      const iconButtonSmall = iconButton.replace('size-8', 'size-7');
      const chip =
        'inline-flex h-7 shrink-0 items-center gap-1.5 rounded-sm border border-border bg-card px-2.5 type-ui text-muted-foreground transition-colors hover:text-foreground aria-pressed:border-primary aria-pressed:bg-primary/10 aria-pressed:text-foreground';
      const count = 'type-mono text-xs';
      const segment =
        'h-7 rounded-xs px-2.5 type-ui text-muted-foreground transition-colors hover:text-foreground aria-pressed:bg-accent aria-pressed:text-foreground';
      const segmented = (label, options, selected) =>
        `<div role="group" aria-label="${label}" class="inline-flex h-8 items-center gap-0.5 rounded-sm border border-border bg-muted p-0.5">${options.map((o) => `<button type="button" aria-pressed="${o === selected}" class="${segment}">${o}</button>`).join('')}</div>`;
      const tab =
        'inline-flex h-9 shrink-0 items-center gap-1.5 border-b-2 border-transparent px-1 type-ui text-muted-foreground transition-colors hover:text-foreground aria-selected:border-primary aria-selected:text-foreground';
      const badge = 'inline-flex h-5 items-center rounded-sm border border-border bg-muted px-1.5 text-xs leading-4 font-medium';
      const pill = 'inline-flex h-5 items-center gap-1.5 rounded-full border border-border px-2 text-xs leading-4 font-medium whitespace-nowrap';
      const dot = (tone) => `<span class="size-1.5 rounded-full ${tone}" aria-hidden="true"></span>`;
      const status = {
        Active: `<span class="${pill}">${dot('bg-success')}Active</span>`,
        Pending: `<span class="${pill}">${dot('bg-warning')}Pending</span>`,
        Failed: `<span class="${pill}">${dot('bg-negative')}Failed</span>`,
        Draft: `<span class="${pill}">${dot('bg-muted-foreground')}Draft</span>`,
        Scheduled: `<span class="${pill}">${dot('bg-info')}Scheduled</span>`,
      };
      const switchControl =
        'group relative h-5 w-9 shrink-0 rounded-sm bg-input transition-colors aria-checked:bg-primary disabled:opacity-40';
      const thumb = 'absolute top-0.5 left-0.5 size-4 rounded-xs bg-white transition-transform group-aria-checked:translate-x-4';
      const toggleRow = (label, on, hint = '', disabled = false) =>
        `<div class="flex h-9 w-full items-center justify-between gap-4"><span class="type-small${disabled ? ' opacity-40' : ''}">${label}${hint ? ` <span class="text-muted-foreground">${hint}</span>` : ''}</span><button type="button" role="switch" aria-checked="${on}" aria-label="${label}"${disabled ? ' disabled' : ''} class="${switchControl}"><span class="${thumb}"></span></button></div>`;
      const radio = 'size-4 shrink-0 appearance-none rounded-full border border-input bg-card transition-[border-width,border-color] checked:border-5 checked:border-primary disabled:opacity-40';
      const option = (name, value, label, hint = '', checked = false, disabled = false) =>
        `<label class="flex h-8 items-center gap-2.5 type-small${disabled ? ' text-muted-foreground' : ''}"><input type="radio" name="${name}" value="${value}"${checked ? ' checked' : ''}${disabled ? ' disabled' : ''} class="${radio}" />${label}${hint ? ` <span class="text-muted-foreground">${hint}</span>` : ''}</label>`;
      const check = (label, state = '', hint = '', extra = '') =>
        `<label class="flex h-8 items-center gap-2.5 type-small${state === 'disabled' ? ' text-muted-foreground' : ''}"><input type="checkbox"${state === 'checked' ? ' checked' : state === 'mixed' ? ' data-indeterminate' : state === 'disabled' ? ' disabled' : ''}${extra} class="ledger-checkbox" />${label}${hint ? ` <span class="text-muted-foreground">${hint}</span>` : ''}</label>`;
      const field =
        'h-8 w-full rounded-sm border border-input bg-card px-3 type-small text-foreground placeholder:text-muted-foreground disabled:opacity-40';
      const slider = (id, label, value, min, max, unit, hint) =>
        `<div class="w-full"><div class="flex items-baseline justify-between"><label for="${id}" class="type-ui">${label}</label><output for="${id}" class="type-mono text-muted-foreground" data-unit="${unit}">${value}${unit}</output></div><input id="${id}" type="range" min="${min}" max="${max}" value="${value}" class="ledger-slider mt-2" /><p class="mt-2 type-caption text-muted-foreground">${hint}</p></div>`;
      const kbd = 'inline-flex h-5 min-w-5 items-center justify-center rounded-xs border border-b-2 border-border bg-muted px-1 font-mono text-xs leading-4 text-muted-foreground';
      const key = (label, keys) => `<li class="flex h-9 items-center justify-between type-small"><span>${label}</span><span class="flex items-center gap-1">${keys}</span></li>`;
      const k = (text) => `<kbd class="${kbd}">${text}</kbd>`;
      const then = '<span class="type-caption text-muted-foreground">then</span>';
      const th = 'h-9 px-2 text-left whitespace-nowrap type-overline text-muted-foreground shadow-[inset_0_-1px_0_0_var(--border)]';
      const sort = 'ledger-sort inline-flex items-center rounded-xs type-overline transition-colors hover:text-foreground';
      const row = 'h-9 border-b border-border last:border-b-0 transition-colors hover:bg-accent/40 data-selected:bg-primary/10';
      const cell = 'px-2 whitespace-nowrap';
      const items = [
        ['Item A', 'Active', '2026-10-14', '14 Oct 2026', 1234],
        ['Item B', 'Pending', '2026-10-13', '13 Oct 2026', 862, true],
        ['Item C', 'Failed', '2026-10-12', '12 Oct 2026', 2075],
        ['Item D', 'Draft', '2026-10-09', '9 Oct 2026', 48],
        ['Item E', 'Active', '2026-10-02', '2 Oct 2026', 316],
      ];
      const tableRow = ([name, state, iso, date, value, selected]) =>
        `<tr class="${row}"${selected ? ' data-selected' : ''}><td class="${cell}"><input type="checkbox"${selected ? ' checked' : ''} class="ledger-checkbox" aria-label="Select ${name}" /></td><td class="${cell}" data-sort="${name}">${name}</td><td class="${cell}">${status[state]}</td><td class="${cell} type-mono text-muted-foreground" data-sort="${iso}">${date}</td><td class="${cell} type-mono text-right" data-sort="${value}">${value.toLocaleString('en-US')}</td></tr>`;
      const log = (time, level, tone, message) =>
        `<span class="flex gap-3 whitespace-nowrap"><span class="shrink-0 text-muted-foreground">${time}</span><span class="w-10 shrink-0 ${tone}">${level}</span><span>${message}</span></span>`;
      const kv = (label, value) => `<div class="flex h-8 items-center justify-between gap-4 type-small"><span class="text-muted-foreground">${label}</span><span class="type-mono">${value}</span></div>`;
      const listRow = (label, value) =>
        `<li class="flex h-9 items-center justify-between gap-4 px-3"><span class="type-small text-muted-foreground">${label}</span><span class="type-mono">${value}</span></li>`;
      const pageButton =
        'h-7 min-w-7 rounded-sm px-1.5 type-mono text-muted-foreground transition-colors hover:bg-accent hover:text-foreground aria-[current=page]:bg-accent aria-[current=page]:text-foreground';
      const tooltip =
        'pointer-events-none absolute bottom-full left-1/2 z-10 mb-2 w-max max-w-56 -translate-x-1/2 rounded-sm border border-border bg-popover px-2 py-1 type-caption text-popover-foreground opacity-0 shadow-lg transition-opacity group-hover:opacity-100 group-focus-within:opacity-100 group-data-open:opacity-100';
      const progress = (label, note, value, tone, readout, textTone = 'text-muted-foreground') =>
        `<div class="w-full"><div class="flex items-baseline justify-between"><span class="type-ui">${label}${note ? ` <span class="font-normal text-muted-foreground">${note}</span>` : ''}</span><span class="type-mono ${textTone}">${readout}</span></div><div role="progressbar" aria-label="${label}" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100" class="mt-2 h-1 w-full overflow-hidden rounded-xs bg-secondary"><div class="h-full w-[${value}%] rounded-xs ${tone}"></div></div></div>`;
      // A labelled row of examples inside a card: the sheet's way of showing variants, sizes and states.
      const group = (label, content) => `<div class="flex flex-col gap-2"><span class="type-overline text-muted-foreground">${label}</span><div class="flex flex-wrap items-center gap-2">${content}</div></div>`;

      // The first four are what the catalog cover shows. A wide card spans two columns from 640px.
      const components = [
        {
          name: 'Stat',
          category: 'Data',
          html: `<div class="flex w-full flex-col"><div class="flex items-center justify-between"><span class="type-overline text-muted-foreground">Metric</span><span class="type-caption text-muted-foreground">Last 24 h</span></div><div class="mt-1 flex items-baseline gap-2"><span class="type-display">1,234</span><span class="inline-flex items-center gap-1 type-ui text-positive">${up}2.4%</span></div><svg class="mt-3 h-12 w-full text-chart-1" viewBox="0 0 240 48" preserveAspectRatio="none" aria-hidden="true"><path d="${trend.area}" fill="currentColor" fill-opacity="0.1"/><path d="${trend.line}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="mt-3 flex items-baseline justify-between border-t border-border pt-3"><span class="type-small text-muted-foreground">Rate</span><span class="inline-flex items-baseline gap-2"><span class="type-mono">12.5%</span><span class="inline-flex items-center gap-1 type-ui text-positive">${up}0.4 pt</span></span></div><div class="mt-2 flex items-baseline justify-between"><span class="type-small text-muted-foreground">Duration</span><span class="inline-flex items-baseline gap-2"><span class="type-mono">00:42</span><span class="inline-flex items-center gap-1 type-ui text-negative">${up}00:03</span></span></div></div>`,
        },
        {
          name: 'Data table',
          category: 'Data',
          span: true,
          stateful: true,
          html: `<div class="w-full overflow-x-auto rounded-md border border-border"><table class="w-full border-collapse type-small"><thead class="bg-muted"><tr><th scope="col" class="${th} w-9"><input type="checkbox" data-indeterminate class="ledger-checkbox" aria-label="Select all rows" /></th><th scope="col" aria-sort="none" class="${th}"><button type="button" class="${sort}">Name</button></th><th scope="col" class="${th}">Status</th><th scope="col" aria-sort="none" class="${th}"><button type="button" class="${sort}">Updated</button></th><th scope="col" aria-sort="none" class="${th} text-right"><button type="button" class="${sort}">Value</button></th></tr></thead><tbody>${items.map(tableRow).join('')}</tbody></table></div>`,
        },
        {
          name: 'Button',
          category: 'Input',
          html: `<div class="flex w-full flex-col gap-4">${group('Variants', `<button type="button" class="${primary}">Save</button><button type="button" class="${secondary}">Continue</button><button type="button" class="${ghost}">Cancel</button><button type="button" class="${destructive}">Delete</button>`)}${group('With icon', `<button type="button" class="${primary}">${icons.plus}Create</button><button type="button" class="${secondary}">${icons.download}Download</button><button type="button" class="${ghost}">${icons.refresh}Refresh</button>`)}</div>`,
        },
        {
          name: 'Code',
          category: 'Text',
          span: true,
          html: `<div class="w-full overflow-x-auto rounded-md border border-border bg-muted p-3 type-mono" tabindex="0" role="region" aria-label="Log"><div class="flex flex-col gap-1">${log('12:04:31', 'info', 'text-info', 'Task started')}${log('12:04:33', 'warn', 'text-warning', 'Retry 1 of 3')}${log('12:04:36', 'error', 'text-negative', 'Request timed out')}${log('12:04:39', 'info', 'text-info', 'Done in 8.2 s')}</div></div><p class="mt-3 type-small text-muted-foreground">Inline code uses the same face: <code class="rounded-xs bg-muted px-1 py-0.5 type-mono">pnpm build</code></p>`,
        },
        {
          name: 'Button sizes',
          category: 'Input',
          html: `<div class="flex w-full flex-col gap-4">${group('Sizes', `<button type="button" class="${secondary} h-7 px-2.5">Small</button><button type="button" class="${secondary}">Default</button><button type="button" class="${secondary} h-9 px-4">Large</button>`)}${group('States', `<button type="button" disabled class="${primary}">${busy}Saving</button><button type="button" disabled class="${primary}">Disabled</button><button type="button" disabled class="${secondary}">Disabled</button>`)}</div>`,
        },
        {
          name: 'Text field',
          category: 'Input',
          stateful: true,
          html: `<div class="flex w-full flex-col gap-4"><label class="block w-full"><span class="type-ui">Email</span><input type="email" placeholder="name@example.com" class="${field} mt-1.5" /><span class="mt-1.5 block type-caption text-muted-foreground">Supporting text for the field.</span></label><label class="block w-full"><span class="type-ui">Value</span><span class="relative mt-1.5 block"><input type="text" inputmode="decimal" value="12.5" class="${field} pr-8 type-mono text-right" /><span class="pointer-events-none absolute inset-y-0 right-3 flex items-center type-small text-muted-foreground">%</span></span></label><label class="block w-full"><span class="type-ui">Email</span><input type="email" value="name@example" aria-invalid="true" aria-describedby="email-error" class="${field} mt-1.5 border-negative" /><span id="email-error" class="mt-1.5 block type-caption text-negative">Enter an email such as name@example.com.</span></label><label class="block w-full"><span class="type-ui text-muted-foreground">Name</span><input type="text" value="Disabled" disabled class="${field} mt-1.5" /></label></div>`,
        },
        {
          name: 'Chip',
          category: 'Input',
          stateful: true,
          html: `<div class="flex w-full flex-col gap-4">${group('Filter', `<div role="group" aria-label="Filter by status" class="flex flex-wrap gap-2"><button type="button" aria-pressed="true" class="${chip}">All<span class="${count}">128</span></button><button type="button" aria-pressed="false" class="${chip}">Active<span class="${count}">96</span></button><button type="button" aria-pressed="false" class="${chip}">Pending<span class="${count}">24</span></button><button type="button" aria-pressed="false" class="${chip}">Failed<span class="${count}">8</span></button></div>`)}${group('With menu', `<div class="flex flex-wrap gap-2"><button type="button" aria-pressed="true" data-toggle class="${chip}">Status<span class="${count}">Active</span>${icons.chevronDown}</button><button type="button" aria-pressed="false" data-toggle class="${chip}">Date${icons.chevronDown}</button></div>`)}</div>`,
        },
        {
          name: 'Segmented control',
          category: 'Navigation',
          stateful: true,
          html: `<div class="flex w-full flex-col gap-4">${group('Three options', segmented('Period', ['Day', 'Week', 'Month'], 'Week'))}${group('Range', segmented('Range', ['1h', '24h', '7d', '30d'], '24h'))}</div>`,
        },
        {
          name: 'Toggle',
          category: 'Input',
          stateful: true,
          html: `<div class="flex w-full flex-col divide-y divide-border">${toggleRow('Notifications', true)}${toggleRow('Email summary', false, '· Weekly')}${toggleRow('Auto-refresh', true)}${toggleRow('Unavailable', false, '', true)}</div>`,
        },
        {
          name: 'Slider',
          category: 'Input',
          stateful: true,
          html: `<div class="flex w-full flex-col gap-6">${slider('value', 'Value', 50, 0, 100, '%', 'Supporting text that explains the setting.')}${slider('interval', 'Interval', 30, 5, 120, ' s', 'The readout follows the thumb.')}</div>`,
        },
        {
          name: 'Single selection',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="w-full"><legend class="type-ui">Choose one</legend><div class="mt-2 flex flex-col">${option('choice', 'a', 'Option A')}${option('choice', 'b', 'Option B', 'Default', true)}${option('choice', 'c', 'Option C')}${option('choice', 'd', 'Option D', 'Unavailable', false, true)}</div><p class="mt-3 type-caption text-muted-foreground">Supporting text that explains the choice.</p></fieldset>`,
        },
        {
          name: 'Checkbox',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="w-full"><legend class="type-ui">Options</legend><div class="mt-2 flex flex-col">${check('Select all', 'mixed', '2 of 3', ' data-all')}<div class="flex flex-col pl-6.5">${check('Option A', 'checked')}${check('Option B', 'checked')}${check('Option C')}</div>${check('Option D', 'disabled', 'Unavailable')}</div></fieldset>`,
        },
        {
          name: 'Icon button',
          category: 'Input',
          stateful: true,
          html: `<div class="flex w-full flex-col gap-4">${group('Default', `<div class="flex items-center gap-1"><button type="button" aria-label="Copy" class="${iconButton}">${icons.copy}</button><button type="button" aria-label="Refresh" class="${iconButton}">${icons.refresh}</button><button type="button" aria-label="Download" class="${iconButton}">${icons.download}</button><button type="button" aria-label="More actions" class="${iconButton}">${icons.more}</button></div>`)}${group('Pressed and disabled', `<div class="flex items-center gap-1"><button type="button" aria-label="Pin" aria-pressed="true" data-toggle class="${iconButton}">${icons.pin}</button><button type="button" aria-label="Filter" disabled class="${iconButton}">${icons.filter}</button></div>`)}${group('Small', `<div class="flex items-center gap-1"><button type="button" aria-label="Copy" class="${iconButtonSmall}">${icons.copy}</button><button type="button" aria-label="More actions" class="${iconButtonSmall}">${icons.more}</button></div>`)}</div>`,
        },
        {
          name: 'Badge',
          category: 'Status',
          html: `<div class="flex flex-wrap items-center gap-2"><span class="${badge}">128</span><span class="${badge} font-mono">v2.4.0</span><span class="${badge}">Label</span><span class="${badge.replace('border-border bg-muted', 'border-primary bg-primary/10')}">New</span><span class="${badge} text-muted-foreground">Archived</span></div>`,
        },
        {
          name: 'Status pill',
          category: 'Status',
          html: `<div class="flex flex-wrap items-center gap-2">${status.Active}${status.Pending}${status.Failed}${status.Draft}${status.Scheduled}</div>`,
        },
        {
          name: 'Tabs',
          category: 'Navigation',
          stateful: true,
          html: `<div class="w-full"><div role="tablist" aria-label="Sections" class="flex w-full gap-2 overflow-x-auto border-b border-border"><button type="button" role="tab" id="tab-overview" aria-selected="true" aria-controls="panel-overview" class="${tab}">Overview</button><button type="button" role="tab" id="tab-items" aria-selected="false" aria-controls="panel-items" tabindex="-1" class="${tab}">Items<span class="${badge}">128</span></button><button type="button" role="tab" id="tab-activity" aria-selected="false" aria-controls="panel-activity" tabindex="-1" class="${tab}">Activity</button></div><div role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" class="pt-2">${kv('Total', '1,234')}${kv('Change', '+2.4%')}${kv('Updated', '14 Oct 2026')}</div><div role="tabpanel" id="panel-items" aria-labelledby="tab-items" hidden class="pt-2">${kv('Active', '96')}${kv('Pending', '24')}${kv('Failed', '8')}</div><div role="tabpanel" id="panel-activity" aria-labelledby="tab-activity" hidden class="pt-2">${kv('Events today', '312')}${kv('Last event', '12:04:31')}${kv('Errors', '1')}</div></div>`,
        },
        {
          name: 'Pagination',
          category: 'Navigation',
          stateful: true,
          html: `<nav aria-label="Pagination" class="flex w-full flex-wrap items-center justify-between gap-3"><span class="type-small text-muted-foreground"><span class="type-mono text-foreground">1–50</span> of <span class="type-mono text-foreground">1,234</span></span><div class="flex items-center gap-0.5"><button type="button" aria-label="Previous page" disabled class="${iconButtonSmall}">${icons.chevronLeft}</button><button type="button" aria-current="page" class="${pageButton}">1</button><button type="button" class="${pageButton}">2</button><button type="button" class="${pageButton}">3</button><span class="px-1 type-mono text-muted-foreground" aria-hidden="true">…</span><button type="button" class="${pageButton}">25</button><button type="button" aria-label="Next page" class="${iconButtonSmall}">${icons.chevronRight}</button></div></nav>`,
        },
        {
          name: 'Tooltip',
          category: 'Status',
          html: `<div class="flex w-full items-center justify-center gap-6 pt-8"><span class="group relative inline-flex" data-open><button type="button" aria-describedby="tip-label" class="${secondary} h-7 px-2.5">Label${icons.help}</button><span role="tooltip" id="tip-label" class="${tooltip}">Tooltip text, one short line</span></span><span class="group relative inline-flex"><button type="button" aria-label="Help" aria-describedby="tip-help" class="${iconButton}">${icons.help}</button><span role="tooltip" id="tip-help" class="${tooltip}">Explains the control it points at</span></span></div>`,
        },
        {
          name: 'Progress',
          category: 'Data',
          html: `<div class="flex w-full flex-col gap-5">${progress('Progress', '', 64, 'bg-primary', '64%')}${progress('Usage', 'this month', 92, 'bg-warning', '92% used', 'text-warning')}${progress('Quota', '', 100, 'bg-negative', '100% reached', 'text-negative')}</div>`,
        },
        {
          name: 'Spinner',
          category: 'Status',
          html: `<div class="flex items-center gap-2.5"><span role="status" aria-label="Loading" class="size-4 animate-spin rounded-full border-2 border-secondary border-t-primary"></span><span class="type-small text-muted-foreground">Loading <span class="type-mono">1,234</span> items</span></div>`,
        },
        {
          name: 'List',
          category: 'Layout',
          html: `<ul class="w-full divide-y divide-border rounded-md border border-border">${listRow('Account', 'Personal')}${listRow('Notifications', 'On')}${listRow('Privacy', 'Private')}${listRow('Updated', '14 Oct 2026')}${listRow('Items', '1,234')}</ul>`,
        },
        {
          name: 'Card',
          category: 'Layout',
          html: `<article class="flex w-full flex-col rounded-lg border border-border bg-card"><header class="flex h-10 items-center justify-between border-b border-border pr-2 pl-4"><h3 class="type-title">Card title</h3><button type="button" aria-label="More actions" class="${iconButton}">${icons.more}</button></header><div class="flex flex-col gap-1 p-4"><span class="type-overline text-muted-foreground">Metric</span><span class="type-display">12.5%</span><span class="type-caption text-muted-foreground">Supporting text that explains the item in a line or two.</span></div><footer class="flex h-10 items-center justify-between border-t border-border pr-2 pl-4"><span class="type-caption text-muted-foreground">Updated 14 Oct 2026</span><button type="button" class="${ghost} h-7 px-2">View</button></footer></article>`,
        },
        {
          name: 'Toolbar',
          category: 'Input',
          span: true,
          stateful: true,
          html: `<div class="flex w-full flex-col gap-3"><div role="toolbar" aria-label="Items" class="flex w-full flex-wrap items-center gap-2"><label class="relative min-w-40 flex-1"><span class="sr-only">Search</span><span class="pointer-events-none absolute inset-y-0 left-2.5 flex items-center text-muted-foreground">${icons.search}</span><input type="search" placeholder="Search" class="${field} pl-8" /></label><div role="group" aria-label="Filters" class="flex gap-2"><button type="button" aria-pressed="true" data-toggle class="${chip}">Status<span class="${count}">Active</span>${icons.chevronDown}</button><button type="button" aria-pressed="false" data-toggle class="${chip}">Date${icons.chevronDown}</button></div><button type="button" class="${secondary}">${icons.download}Export</button></div><ul class="w-full divide-y divide-border rounded-md border border-border"><li class="flex h-9 items-center gap-3 px-3 type-small"><span class="flex-1 truncate">Item A</span><span class="type-mono">1,234</span>${status.Active}</li><li class="flex h-9 items-center gap-3 px-3 type-small"><span class="flex-1 truncate">Item E</span><span class="type-mono">316</span>${status.Active}</li><li class="flex h-9 items-center gap-3 px-3 type-small"><span class="flex-1 truncate">Item F</span><span class="type-mono">97</span>${status.Active}</li></ul><p class="type-caption text-muted-foreground"><span class="type-mono">3</span> items match · sorted by name</p></div>`,
        },
        {
          name: 'Keyboard key',
          category: 'Text',
          html: `<ul class="w-full divide-y divide-border">${key('Search', k('⌘') + k('K'))}${key('Go to page', k('G') + then + k('P'))}${key('Next item', k('J'))}${key('Select', k('Space'))}${key('Toggle theme', k('⇧') + k('D'))}${key('All shortcuts', k('?'))}</ul>`,
        },
      ];

      // Categories in the order they first appear in the list above.
      const categories = [...new Set(components.map((c) => c.category))];
      const gallery = document.getElementById('gallery');
      const theme = document.getElementById('theme');

      const syncDemo = (root) => {
        root.querySelectorAll('input[type=range]').forEach((el) => {
          el.style.setProperty('--slider-fill', `${((el.value - el.min) / (el.max - el.min)) * 100}%`);
          const out = root.querySelector(`output[for="${el.id}"]`);
          if (out) out.textContent = `${el.value}${out.dataset.unit ?? ''}`;
        });
        root.querySelectorAll('input[data-indeterminate]').forEach((el) => (el.indeterminate = true));
      };

      theme.innerHTML = icons.theme;
      document.getElementById('meta').textContent = `${components.length} components · ${categories.length} categories`;
      const card = (c) => {
        const i = components.indexOf(c);
        return `<article data-index="${i}" data-category="${c.category}" class="mb-4 flex flex-col self-start rounded-lg border border-border bg-card${c.span ? ' sm:col-span-2' : ''}">
            <header class="flex h-10 shrink-0 items-center justify-between border-b border-border pr-2 pl-4">
              <h3 class="type-title">${c.name}</h3>
              <div class="flex gap-0.5">
                ${c.stateful ? `<button type="button" data-reset aria-label="Reset ${c.name}" class="${iconButton}">${icons.reset}</button>` : ''}
                <button type="button" data-copy aria-label="Copy ${c.name} markup" class="${iconButton}">${icons.copy}</button>
              </div>
            </header>
            <div data-demo class="flex flex-col items-start p-4">${c.html}</div>
          </article>`;
      };
      // A section title with the count, 24px above and below, then the group's cards.
      gallery.innerHTML = categories
        .map((name) => {
          const group = components.filter((c) => c.category === name);
          const id = `group-${name.toLowerCase()}`;
          return `<section aria-labelledby="${id}"><h2 id="${id}" class="flex items-baseline gap-2 pt-2 pb-6 type-h2">${name}<span class="type-mono text-muted-foreground">${group.length}</span></h2><div class="grid auto-rows-[1px] grid-flow-dense grid-cols-1 gap-x-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">${group.map(card).join('')}</div></section>`;
        })
        .join('');
      syncDemo(gallery);

      // Masonry: each card spans one 1px row per pixel of its height plus its 16px bottom margin. The spans follow
      // the cards' own size (fonts loading, a tab with more rows, a narrower column), never the window's height.
      const fit = (card) => (card.style.gridRowEnd = `span ${Math.ceil(card.getBoundingClientRect().height) + 16}`);
      const observer = new ResizeObserver((entries) => entries.forEach((entry) => fit(entry.target)));
      for (const article of gallery.querySelectorAll('article[data-index]')) observer.observe(article);

      theme.addEventListener('click', () => document.documentElement.classList.toggle('dark'));

      gallery.addEventListener('input', (event) => syncDemo(event.target.closest('[data-demo]')));

      // Checkboxes: a table's header box, or a box marked data-all, selects every box below it and shows a dash for some.
      gallery.addEventListener('change', (event) => {
        const box = event.target;
        if (box.type !== 'checkbox') return;
        const table = box.closest('table');
        const scope = table ?? box.closest('fieldset');
        if (!scope) return;
        const all = table ? table.querySelector('thead input[type=checkbox]') : scope.querySelector('[data-all]');
        if (!all) return;
        const boxes = table ? [...table.querySelectorAll('tbody input[type=checkbox]')] : [...all.closest('label').nextElementSibling.querySelectorAll('input')];
        if (box === all) {
          for (const b of boxes) {
            b.checked = all.checked;
            b.closest('tr')?.toggleAttribute('data-selected', all.checked);
          }
          all.indeterminate = false;
          return;
        }
        if (!boxes.includes(box)) return;
        box.closest('tr')?.toggleAttribute('data-selected', box.checked);
        const checked = boxes.filter((b) => b.checked).length;
        all.checked = checked === boxes.length;
        all.indeterminate = checked > 0 && checked < boxes.length;
        const hint = all.closest('label').querySelector('.text-muted-foreground');
        if (hint && !table) hint.textContent = `${checked} of ${boxes.length}`;
      });

      // Tabs: the pointer or the arrow keys select one; its panel shows, the others hide.
      const selectTab = (selected) => {
        const demo = selected.closest('[data-demo]');
        for (const t of selected.parentElement.querySelectorAll('[role=tab]')) {
          t.setAttribute('aria-selected', t === selected);
          t.tabIndex = t === selected ? 0 : -1;
        }
        for (const panel of demo.querySelectorAll('[role=tabpanel]')) panel.hidden = panel.id !== selected.getAttribute('aria-controls');
      };
      gallery.addEventListener('keydown', (event) => {
        const current = event.target.closest('[role=tab]');
        if (!current || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        const tabs = [...current.parentElement.querySelectorAll('[role=tab]')];
        const index = tabs.indexOf(current);
        const next =
          event.key === 'Home' ? tabs[0] : event.key === 'End' ? tabs[tabs.length - 1] : tabs[(index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
        event.preventDefault();
        selectTab(next);
        next.focus();
      });

      gallery.addEventListener('click', async (event) => {
        const card = event.target.closest('article[data-index]');
        if (!card) return;
        const component = components[card.dataset.index];
        const toggle = event.target.closest('[role=switch]');
        const tabButton = event.target.closest('[role=tab]');
        const pressed = event.target.closest('[aria-pressed]');
        const page = event.target.closest('nav[aria-label=Pagination] button');
        const sortButton = event.target.closest('.ledger-sort');
        const copy = event.target.closest('[data-copy]');
        if (toggle) toggle.setAttribute('aria-checked', toggle.getAttribute('aria-checked') !== 'true');
        if (tabButton) selectTab(tabButton);
        if (pressed && !pressed.closest('article > header')) {
          // A chip or a segment selects one of its group; a toggle chip or icon button simply flips.
          if (pressed.dataset.toggle !== undefined) pressed.setAttribute('aria-pressed', pressed.getAttribute('aria-pressed') !== 'true');
          else for (const b of pressed.parentElement.querySelectorAll(':scope > [aria-pressed]')) b.setAttribute('aria-pressed', b === pressed);
        }
        if (page) {
          const nav = page.closest('nav');
          const pages = [...nav.querySelectorAll('button:not([aria-label])')];
          const prev = nav.querySelector('[aria-label="Previous page"]');
          const next = nav.querySelector('[aria-label="Next page"]');
          let index = pages.findIndex((b) => b.getAttribute('aria-current') === 'page');
          if (page === prev) index = Math.max(0, index - 1);
          else if (page === next) index = Math.min(pages.length - 1, index + 1);
          else index = pages.indexOf(page);
          pages.forEach((b, i) => (i === index ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
          prev.disabled = index === 0;
          next.disabled = index === pages.length - 1;
          const from = (Number(pages[index].textContent) - 1) * 50 + 1;
          nav.querySelector('.type-mono').textContent = `${from.toLocaleString('en-US')}–${Math.min(from + 49, 1234).toLocaleString('en-US')}`;
        }
        if (sortButton) {
          const header = sortButton.closest('th');
          const direction = header.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
          for (const h of header.parentElement.querySelectorAll('[aria-sort]')) h.setAttribute('aria-sort', 'none');
          header.setAttribute('aria-sort', direction);
          const column = [...header.parentElement.children].indexOf(header);
          const body = header.closest('table').tBodies[0];
          const key = (tr) => {
            const value = tr.children[column].dataset.sort;
            return Number.isNaN(Number(value)) ? value : Number(value);
          };
          [...body.rows]
            .sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * (direction === 'ascending' ? 1 : -1))
            .forEach((tr) => body.append(tr));
        }
        if (event.target.closest('[data-reset]')) {
          const demo = card.querySelector('[data-demo]');
          demo.innerHTML = component.html;
          syncDemo(demo);
        }
        if (copy) {
          try {
            await navigator.clipboard.writeText(component.html);
            copy.innerHTML = icons.check;
            setTimeout(() => (copy.innerHTML = icons.copy), 1200);
          } catch {
            // Over file:// there is no clipboard; the button simply stays as it is.
          }
        }
      });
    </script>
  </body>
</html>
